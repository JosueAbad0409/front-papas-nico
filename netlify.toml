[build]
  command = "npm run build"
  publish = "dist/front-papas-nico/browser"

[build.environment]
  NODE_VERSION = "22"

# Enviar las consultas del frontend al backend en Render.
[[redirects]]
  from = "/api/*"
  to = "https://api-papas-nico.onrender.com/api/:splat"
  status = 200
  force = true

# Permitir abrir y recargar rutas de Angular.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Permitir que el navegador compruebe nuevas versiones.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw.json"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/ngsw-worker.js"
  [headers.values]
    Cache-Control = "no-cache"